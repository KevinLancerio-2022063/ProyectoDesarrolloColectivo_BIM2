<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Apoyo Emocional</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/Base.css}">
    <link rel="stylesheet" th:href="@{/css/ApoyoEmocional.css}">
</head>
<body>

  <nav>
    <a th:href="@{/}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
      <li><a th:href="@{/}">Inicio</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <div class="page-header-left">
      <div class="page-tag">Bienestar personal</div>
      <h1 class="page-title">Apoyo <em>Emocional</em></h1>
    </div>
    <a th:href="@{/agregarApoyo}" class="btn-primary">＋ Nuevo apoyo</a>
  </div>

  <div class="apoyo-container">

    <div class="toolbar">
      <form th:action="@{/apoyos}" method="get" class="search-box">
        
        <div class="input-group">
          <input type="number" name="id" class="search-input" placeholder="Buscar por ID...">
          <button type="submit" class="btn-primary">Buscar</button>
        </div>

      </form>

      <span class="contador" th:text="${#lists.size(listaApoyos)} + ' registros'"></span>
    </div>

      <div class="apoyo-grid">
        <a th:each="apoyo : ${listaApoyos}"
          th:href="@{'/detalleApoyo/' + ${apoyo.idApoyoEmocional}}"
          class="apoyo-card">
          <div class="apoyo-glow"></div>
          <div class="apoyo-borderglow"></div>
          <div class="apoyo-titulo" th:text="${apoyo.titulo}"></div>
          <div class="apoyo-categoria">
            Categoría: <strong th:text="${apoyo.categoria}"></strong>
          </div>
          <div class="apoyo-contenido" th:text="${apoyo.contenido}"></div>
          <div class="apoyo-info">
            <span th:text="${'Apoyo: #' + apoyo.idApoyoEmocional}"></span>
          </div>
        </a>
      </div>
  </div>

  <!-- Modal de Error -->
  <div th:if="${error}" class="modal-overlay modal-error">
    <div class="modal-container">

      <div class="modal-body">
        <div class="modal-content">

          <div class="modal-icon">
            ⚠
          </div>

          <div class="modal-text">
            <h3>Error</h3>
            <p th:text="${error}"></p>
          </div>

        </div>
      </div>

      <div class="modal-footer">
        <a th:href="@{/apoyoEmocional}" class="btn-danger">aceptar</a>
      </div>

    </div>

  </div>
</body>
</html>
