<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios</title>
  <link rel="stylesheet" th:href="@{/Base.css}">
  <link rel="stylesheet" th:href="@{/Ejercicio.css}">
</head>
<body>

<nav>
  <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
  <ul class="nav-links">
    <li><a th:href="@{/index}">Inicio</a></li>
  </ul>
</nav>

<div th:if="${exito}" class="alerta" th:text="${exito}"></div>

<div class="page-header">
  <div class="page-header-left">
    <div class="page-tag">Tu entrenamiento</div>
    <h1 class="page-title">Mis <em>Ejercicios</em></h1>
  </div>
  <a th:href="@{/ejercicios}" class="btn-primary">＋ Nuevo ejercicio</a>
</div>

<div class="ejercicios-container">

  <div class="toolbar">
    <form th:action="@{/ejercicios/buscarEjercicio}" method="get" class="search-form">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="number" name="id" class="search-input" placeholder="Buscar por ID..."/>
      </div>
      <button type="submit" class="btn-primary">Buscar</button>
    </form>
    <span class="contador" th:text="${#lists.size(ejercicios)} + ' ejercicio(s)'">0 ejercicio(s)</span>
  </div>

  <div class="ejercicios-grid">

    <div class="ej-card" th:each="ej : ${ejercicios}">

      <div class="ej-card-header">
        <div>
          <div class="ej-id" th:text="'# ' + ${ej.id_ejercicio}">ID</div>
          <div class="ej-nombre" th:text="${ej.nombre_ejercicio}">Nombre</div>
          <span class="ej-rutina-badge" th:text="'Rutina #' + ${ej.fk_id_rutina}">Rutina</span>
        </div>
        <div class="ej-card-actions">
          <a th:href="@{'/ejercicios/editarEjercicio' + ${ej.id_ejercicio}}"
             class="ej-btn-edit" title="Editar">✏️</a>
          <form th:action="@{/ejercicios/eliminarEjercicio/{id}(id=${ej.id_ejercicio})}"
                method="post" style="display:inline;">
            <button type="submit" class="ej-btn-delete" title="Eliminar">🗑️</button>
          </form>
        </div>
      </div>

      <div class="ej-stats">
        <div class="ej-stat">
          <div class="ej-stat-num" th:text="${ej.series_ejercicio}">0</div>
          <div class="ej-stat-label">SERIES</div>
        </div>
        <div class="ej-stat-divider"></div>
        <div class="ej-stat">
          <div class="ej-stat-num" th:text="${ej.repeticiones_ejercicio}">0</div>
          <div class="ej-stat-label">REPS</div>
        </div>

        <div class="ej-stat-divider"></div>
        <div class="ej-stat">
          <div class="ej-stat-num" th:text="${ej.tiempo_ejercicio}">0</div>
          <div class="ej-stat-label">SEG</div>
        </div>

        <div class="ej-stat-divider"></div>
        <div class="ej-stat">
          <div class="ej-stat-num" th:text="${ej.descanso_ejercicio}">0</div>
          <div class="ej-stat-label">DESC.</div>
        </div>
      </div>

      <div class="ej-barras">
        <div class="ej-barra"></div>
        <div class="ej-barra"></div>
        <div class="ej-barra ej-barra-dim"></div>
        <div class="ej-barra ej-barra-dim"></div>
      </div>

    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(ejercicios)}">
      <div class="empty-icon">🏋️</div>
      <p class="empty-text">No hay ejercicios registrados todavía.</p>
    </div>

  </div>
</div>

<div class="form-section-wrap">
  <div class="form-section">
    <div class="form-section-header">
      <h2 class="form-section-title">Nuevo <em>Ejercicio</em></h2>
      <p class="form-section-sub">Completa los campos para registrar un ejercicio en una rutina.</p>
    </div>

    <div class="form-group">
      <label class="form-label">Nombre del ejercicio</label>
      <input type="text" class="form-input" placeholder="Ej. Sentadillas" maxlength="60"/>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Series</label>
        <input type="number" class="form-input" placeholder="4" min="1" max="20"/>
      </div>
      <div class="form-group">
        <label class="form-label">Repeticiones</label>
        <input type="number" class="form-input" placeholder="12" min="0" max="200"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Tiempo (seg)</label>
        <input type="number" class="form-input" placeholder="0 si no aplica" min="0" max="300"/>
      </div>
      <div class="form-group">
        <label class="form-label">Descanso (seg)</label>
        <input type="number" class="form-input" placeholder="60" min="0" max="600"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">ID de la rutina</label>
      <input type="number" class="form-input" placeholder="ID de la rutina" min="1"/>
    </div>

    <div class="form-actions">
      <button class="btn-secondary">Cancelar</button>
      <button class="btn-primary">Guardar ejercicio</button>
    </div>
  </div>
</div>

</body>
</html>
