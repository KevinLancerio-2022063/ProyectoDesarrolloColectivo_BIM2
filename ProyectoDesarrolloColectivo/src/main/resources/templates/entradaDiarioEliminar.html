<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Entrada Diario</title>
    <link rel="stylesheet" th:href="@{/entradaDiario.css(v=${#dates.createNow().time})}">
</head>
<body class="delete-page">

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<main class="delete-main">
    <section class="delete-box">

        <div class="delete-icon">!</div>

        <p class="delete-tag">Confirmación · Entrada Diario</p>

        <h1>Eliminar <em>Entrada</em></h1>

        <p class="delete-message">
            Estás a punto de eliminar esta entrada de diario. Esta acción no se puede deshacer.
        </p>

        <div class="delete-info">
            <p><strong>ID:</strong> <span th:text="${entrada.id_entrada_diario}">10</span></p>
            <p><strong>Fecha:</strong> <span th:text="${entrada.fecha}">2025-01-10</span></p>
            <p><strong>¿Qué pasó?:</strong> <span th:text="${entrada.que_paso}">Texto</span></p>
            <p><strong>Plan mañana:</strong> <span th:text="${entrada.plan_mañana}">Texto</span></p>
            <p><strong>Reflexión:</strong> <span th:text="${entrada.reflexion}">Texto</span></p>
        </div>

        <form class="delete-form"
              th:action="@{/entradaDiario/eliminar/{id}(id=${entrada.id_entrada_diario})}"
              method="post">

            <div class="delete-buttons">
                <a th:href="@{/entradaDiario}" class="delete-cancel">Cancelar</a>
                <button type="submit" class="delete-confirm">Sí, eliminar</button>
            </div>

        </form>

    </section>
</main>

<script>
    const dot = document.querySelector(".cursor-dot");
    const ring = document.querySelector(".cursor-ring");

    window.addEventListener("mousemove", function(e) {
        dot.style.left = e.clientX + "px";
        dot.style.top = e.clientY + "px";

        ring.animate({
            left: e.clientX + "px",
            top: e.clientY + "px"
        }, {
            duration: 420,
            fill: "forwards"
        });

        const trail = document.createElement("span");
        trail.className = "cursor-trail";
        trail.style.left = e.clientX + "px";
        trail.style.top = e.clientY + "px";
        document.body.appendChild(trail);

        setTimeout(() => trail.remove(), 600);
    });
</script>

</body>
</html>
