<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/baseLancerio.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<nav>
    <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
        <li><a th:href="@{/index}">Inicio</a></li>
    </ul>
</nav>

<div class="usuario-container">

    <!-- Encabezado con el texto "Gestión de Usuarios" -->
    <div class="page-header">
        <h1 class="page-title">Gestión de <em>Usuarios</em></h1>
    </div>

    <!-- Barra para buscar por Id y botón de agregar usuario -->
    <div class="toolbar">

        <div class="search-wrap">     <!-- Ícono de la lupa del buscar -->
            <span class="search-icon"><i class="bi bi-search"></i></span>
            <input type="text"
                   id="buscar"
                   class="search-input"
                   placeholder="Buscar por ID..."
                   onkeyup="filtrarTabla()">
        </div>

        <button class="btn-primary"
                onclick="window.location.href='/usuarios'">
            ＋ Nuevo usuario
        </button>

    </div>

    <!-- Aqui aparecerán las tarjetas de los usuarios -->
    <div class="usuarios-grid" id="tablaUsuarios">

        <div class="usuario-card"

             th:each="u : ${usuarios}"
             th:attr="data-id=${u.id_usuario}">

            <div class="card-header">

                <div class="usuario-avatar"
                     th:text="${#strings.toUpperCase(#strings.substring(u.nombre_completo,0,2))}">
                </div>

                <div class="card-actions">

                    <!-- botón editar -->
                    <a class="btn-icon btn-edit"
                       th:href="@{/usuarios/editar/{id}(id=${u.id_usuario})}">
                        <!-- Ícono del lápiz -->
                        <i class="bi bi-pencil"></i>
                    </a>

                    <!-- boton Eliminar con el modal -->
                    <!-- El th:attr sirve para establecer el valor de cualquier atributo html, ejecuta la eliminación si el usuario lo confirma -->
                    <a class="btn-icon btn-delete"
                       href="#"
                    th:attr="onclick=|openModal('/usuarios/eliminar/${u.id_usuario}')|">
                        <!-- Ícono del bote de basura -->
                        <i class="bi bi-trash-fill"></i>
                 </a>

             </div>

         </div>

         <div class="card-body">
             <p class="card-name" th:text="${u.nombre_completo}"></p>
             <p class="card-email" th:text="${u.correoUsuario}"></p>
         </div>

         <div class="card-footer">
             <span class="card-id" th:text="'#' + ${u.id_usuario}"></span>
             <span class="pass-badge">••••••</span>
         </div>

     </div>

     <!-- Si no hay usuarios lo indicará con el mensaje -->
        <div class="card-empty" th:if="${#lists.isEmpty(usuarios)}">
            <p>No hay usuarios registrados</p>
        </div>

    </div>

    <!--Tarjeta/Notificación de Error -->
    <div th:if="${errores != null}" class="error-container">

        <div class="card error-card" th:each="err : ${errores}">

            <div class="header">   <!--Ícono de Error (X) -->
                <div class="image"><i class="bi bi-x"></i></div>

                <div class="content">
                    <span class="title">Error</span>
                    <p class="message" th:text="${err}"></p>
                </div>
            </div>

        </div>

    </div>

    <!--Tarjeta/Notificación de Éxito -->
    <div th:if="${success}" class="error-container">

        <div class="card success-card">

            <div class="header">   <!--Ícono de éxito (Cheque) -->
                <div class="image"><i class="bi bi-check-lg"></i></div>

                <div class="content">
                    <span class="title">Operación exitosa</span>
                    <p class="message" th:text="${success}"></p>
                </div>
            </div>

        </div>

    </div>

    <!-- Formulario ingresar los datos -->
    <div class="form-section-wrap">
        <div class="form-section">

            <h2 class="form-title">
                <span th:if="${usuario.id_usuario != null}">
                    Editar <em>usuario</em>
                </span>
                <span th:if="${usuario.id_usuario == null}">
                    Nuevo <em>usuario</em>
                </span>
            </h2>

            <form th:action="@{/usuarios/guardar}"
                  th:object="${usuario}"
                  method="post">

                <input type="hidden" th:field="*{id_usuario}">

                <input class="form-input"
                       type="text"
                       th:field="*{nombre_completo}"
                       placeholder="Nombre completo"
                       required>

                <input class="form-input"
                       type="email"
                       th:field="*{correoUsuario}"
                       placeholder="Correo"
                       required>

                <input class="form-input"
                       type="password"
                       th:field="*{contraseña}"
                       placeholder="Contraseña"
                       required>

                <div class="form-actions">
                    <button type="button"
                            class="btn-secondary"
                            onclick="window.location.href='/usuarios'">
                        Cancelar
                    </button>

                    <button type="submit" class="btn-primary">
                        <span th:text="${usuario.id_usuario != null}
                          ? 'Actualizar' : 'Guardar'"></span>
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>

<!-- Modal del Eliminar -->
<div id="confirmModal" class="modal hidden">
    <div class="card confirm-card">

        <div class="header">             <!-- Ícono de un triángulo de peligro -->
            <div class="image"><i class="bi bi-exclamation-triangle text-danger"></i>️</div>

            <div class="content">
                <span class="title">¿Eliminar usuario?</span>
                <p class="message">Esta acción no se puede deshacer</p>
            </div>
        </div>

        <div class="actions">
            <button id="btnDelete" class="desactivate">
                Eliminar
            </button>

            <button onclick="closeModal()" class="cancel">
                Cancelar
            </button>
        </div>

    </div>
</div>

<!-- Contenedor de errores -->
<div id="errorContainer" class="error-container"></div>

<!-- Dirección del script buscar por id y el modal -->
<script th:src="@{/js/usuario.js}"></script>

</body>
</html>
