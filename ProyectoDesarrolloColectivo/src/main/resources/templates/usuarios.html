<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/baseLancerio.css}">
</head>

<body>
<nav>
    <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
        <li><a th:href="@{/index}">Inicio</a></li>
    </ul>
</nav>

<div class="usuario-container">

    <!-- Encabezado -->
    <div class="page-header">
        <p class="page-tag">Administración</p>
        <h1 class="page-title">Gestión de <em>Usuarios</em></h1>
    </div>

    <!-- Barra para el buscador por Id -->
    <div class="toolbar">

        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text"
                   id="buscar"
                   class="search-input"
                   placeholder="Buscar por ID..."
                   onkeyup="filtrarTabla()">
        </div>

        <span class="result-count"
              th:text="${#lists.size(usuarios)} + ' usuarios'">
        </span>

        <button class="btn-primary"
                onclick="window.location.href='/usuarios'">
            ＋ Nuevo usuario
        </button>

    </div>

    <!-- Tarjetas con los botones -->
    <div class="usuarios-grid" id="tablaUsuarios">

        <div class="usuario-card"
             th:each="u : ${usuarios}"
             th:attr="data-id=${u.id_usuario}">

            <div class="card-header">

                <div class="usuario-avatar"
                     th:text="${#strings.toUpperCase(#strings.substring(u.nombre_completo,0,2))}">
                </div>

                <div class="card-actions">
                    <a class="btn-icon"
                       th:href="@{/usuarios/editar/{id}(id=${u.id_usuario})}">✏️</a>

                    <a class="btn-icon"
                       th:href="@{/usuarios/eliminar/{id}(id=${u.id_usuario})}"
                       onclick="return confirm('¿Eliminar usuario?')">🗑️</a>
                </div>

            </div>

            <div class="card-body">
                <p class="card-name" th:text="${u.nombre_completo}"></p>
                <p class="card-email" th:text="${u.correoUsuario}"></p>
            </div>

            <div class="card-footer">
                <span class="card-id" th:text="'#' + ${u.id_usuario}"></span>
                <span class="pass-badge">••••••</span>
            </div>

        </div>

        <!-- Si no hya usuarios mostrará este mensaje -->
        <div class="card-empty" th:if="${#lists.isEmpty(usuarios)}">
            <p>No hay usuarios registrados</p>
        </div>

    </div>

    <!-- Formulario para ingresar los datos -->
    <div class="form-section-wrap">
        <div class="form-section">

            <h2 class="form-title">
                <span th:if="${usuario.id_usuario != null}">
                    Editar <em>usuario</em>
                </span>
                <span th:if="${usuario.id_usuario == null}">
                    Nuevo <em>usuario</em>
                </span>
            </h2>

            <form th:action="@{/usuarios/guardar}"
                  th:object="${usuario}"
                  method="post">

                <input type="hidden" th:field="*{id_usuario}">

                <input class="form-input"
                       type="text"
                       th:field="*{nombre_completo}"
                       placeholder="Nombre completo"
                       required>

                <input class="form-input"
                       type="email"
                       th:field="*{correoUsuario}"
                       placeholder="Correo"
                       required>

                <input class="form-input"
                       type="password"
                       th:field="*{contraseña}"
                       placeholder="Contraseña"
                       required>

                <div class="form-actions">
                    <button type="button"
                            class="btn-secondary"
                            onclick="window.location.href='/usuarios'">
                        Cancelar
                    </button>

                    <button type="submit" class="btn-primary">
                        <span th:text="${usuario.id_usuario != null}
                          ? 'Actualizar' : 'Guardar'"></span>
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>

<!-- dirección del buscador por Id de Usuario -->
<script
        th:src="@{/js/buscadorUsuario.js}">
</script>

</body>
</html>
