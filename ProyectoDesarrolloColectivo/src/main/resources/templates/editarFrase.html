<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Frase Motivadora</title>
    <link rel="stylesheet" th:href="@{/Base.css}">
    <link rel="stylesheet" th:href="@{/FraseMotivadora.css}">
</head>
<body>
    <nav>
        <a th:href="@{/}" class="nav-logo">Evoluciona</a>
        <ul class="nav-links">
            <li><a th:href="@{/}">Inicio</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <div class="page-header-left">
            <div class="page-tag">Bienestar personal</div>
            <h1 class="page-title">Frase <em>Motivadora</em></h1>
        </div>
    </div>

    <div class="detalle-container">
        <div class="detalle-card">
            <div class="detalle-header">
                <h1 class="detalle-titulo">Editar Frase Motivadora</h1>
            </div>
            <form th:action="@{/guardarFrase}"  th:object="${frase}" method="post" class="apoyo-form">
                <input type="hidden" th:field="*{idFraseMotivadora}">
                <div class="form-group">
                    <label for="texto">Texto:</label>
                    <textarea id="texto" th:field="*{texto}" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" th:field="*{autor}" class="form-control">
                </div>
                <div class="detalle-footer">
                    <button type="submit" class="btn-guardar">
                        <div class="btn-guardar-slider">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20" width="20"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
                                <path d="m19,21H5c-1.1,0-2-.9-2-2V5c0-1.1.9-2,2-2h11l5,5v11c0,1.1-.9,2-2,2Z"
                                    data-path="box"></path>
                                <path d="M7 3L7 8L15 8" data-path="line-top"></path>
                                <path d="M17 20L17 13L7 13L7 20" data-path="line-bottom"></path>
                            </svg>
                        </div>
                        <span class="btn-guardar-text">Guardar</span>
                    </button>
                    <a th:href="@{/frasesMotivadoras}" class="btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
