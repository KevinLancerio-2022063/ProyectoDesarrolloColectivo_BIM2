<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <title>Objetivos</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' th:href="@{/Base.css}">
    <link rel='stylesheet' th:href="@{/Objetivos.css}">
</head>
<body>

  <nav>
    <a th:href="@{/}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
      <li><a th:href="@{/}">Inicio</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <div class="page-header-left">
      <div class="page-tag">Metas personales</div>
      <h1 class="page-title">Obje<em>tivos</em></h1>
    </div>
    <a th:href="@{/agregarObjetivo}" class="btn-primary">＋ Nuevo objetivo</a>
  </div>

  <div class="objetivos-container">

    <div class="toolbar">
      <input type="text" class="search-input" placeholder="Buscar objetivo...">
      <span class="contador" th:text="${#lists.size(listaObjetivos)} + ' objetivos'"></span>
    </div>

    <div class="objetivos-grid">

      <a th:each="objetivo : ${listaObjetivos}" 
        th:href="@{'/detalleObjetivos/' + ${objetivo.idObjetivos}}" 
        class="objetivo-card">
        <div class="objetivo-glow"></div>
        <div class="objetivo-borderglow"></div>
        <div class="objetivo-titulo" th:text="${objetivo.tituloObjetivo}"></div>
        <div class="objetivo-descripcion" th:text="${objetivo.descripcionObjetivo}"></div>
        <div class="objetivo-info">
          <span></span>
          <span th:text="${'Objetivo: #' + objetivo.idObjetivos}"></span>
        </div>
      </a>

    </div>
  </div>

</body>
</html>
