<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <title>Objetivos</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' th:href="@{/css/Base.css}">
    <link rel='stylesheet' th:href="@{/css/Objetivos.css}">
</head>
<body>

  <div class="hero-bg">
    <div class="cube"></div>
    <div class="cube"></div>
    <div class="cube"></div>
    <div class="cube"></div>
    <div class="cube"></div>
    <div class="cube"></div>
  </div>
  
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <nav>
    <a th:href="@{/}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
      <li><a th:href="@{/}">Inicio</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <div class="page-header-left">
      <div class="page-tag">Metas personales</div>
      <h1 class="page-title">Obje<em>tivos</em></h1>
    </div>
    <a th:href="@{/agregarObjetivo}" class="btn-primary">＋ Nuevo objetivo</a>
  </div>

  <div class="objetivos-container">

    <div class="toolbar">
      <form th:action="@{/buscar}" method="get" class="search-box">
        
        <div class="input-group">
          <input type="number" name="id" class="search-input" placeholder="Buscar por ID...">
          <button type="submit" class="btn-primary">Buscar</button>
        </div>

      </form>
      <span class="contador" th:text="${#lists.size(listaObjetivos)} + ' objetivos'"></span>
    </div>

    <div class="objetivos-grid">

      <a th:each="objetivo : ${listaObjetivos}" 
        th:href="@{'/detalleObjetivos/' + ${objetivo.idObjetivos}}" 
        class="objetivo-card">
        <div class="objetivo-glow"></div>
        <div class="objetivo-borderglow"></div>
        <div class="objetivo-titulo" th:text="${objetivo.tituloObjetivo}"></div>
        <div class="objetivo-descripcion" th:text="${objetivo.descripcionObjetivo}"></div>
        <div class="objetivo-info">
          <span></span>
          <span th:text="${'Objetivo: #' + objetivo.idObjetivos}"></span>
        </div>
      </a>

    </div>
  </div>

   <!-- Modal de Error -->
  <div th:if="${error}" class="modal-overlay modal-error">
    <div class="modal-container">

      <div class="modal-body">
        <div class="modal-content">

          <div class="modal-icon">
            ⚠
          </div>

          <div class="modal-text">
            <h3>Error</h3>
            <p th:text="${error}"></p>
          </div>

        </div>
      </div>

      <div class="modal-footer">
        <a th:href="@{/objetivos}" class="btn-danger">aceptar</a>
      </div>

    </div>

  </div>
  <script th:src="@{/js/Base.js}"></script>
</body>
</html>
