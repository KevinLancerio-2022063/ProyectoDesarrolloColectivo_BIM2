<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — Florece</title>
    <link th:href="@{/Login.css}" rel="stylesheet"/>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1 class="logo">Flore<span>ce</span></h1>
        <h2>Iniciar sesión</h2>

        <!-- FORM UIVERSE + THYMELEAF -->
        <form class="form" th:action="@{/login}" method="post">

      <span class="input-span">
        <label for="email" class="label">Email</label>
        <input type="email" name="email" id="email" required />
      </span>

            <span class="input-span">
        <label for="password" class="label">Password</label>
        <input type="password" name="password" id="password" required />
      </span>

            <span class="span">
        <a href="#">Forgot password?</a>
      </span>

            <input class="submit" type="submit" value="Log in" />

            <span class="span">
        Don't have an account?
        <a th:href="@{/register}">Sign up</a>
      </span>

        </form>

        <a th:href="@{/}" class="back">← Volver al inicio</a>

    </div>

</div>

</body>
</html>
