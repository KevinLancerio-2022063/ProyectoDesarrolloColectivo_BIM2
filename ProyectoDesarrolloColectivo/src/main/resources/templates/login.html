<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Desarrollo Colectivo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/login.css}" href="../static/css/login.css" />
</head>
<body>
<div class="bg"></div>
<div class="bg bg2"></div>
<div class="bg bg3"></div>

<div class="contenedor">
    <div class="tarjeta">
        <div class="panel-form">
            <h2 class="subtitulo">Iniciar sesión</h2>
            <p th:if="${error}" th:text="${error}" style="color: #d9534f; font-size: 14px; margin-bottom: 15px; text-align: center; font-weight: 600;"></p>

            <form class="formulario" th:action="@{/login}" method="post">
                <label for="correo">Correo</label>
                <input id="correo" name="usuario" type="email" placeholder="tu@correo.com" required />

                <label for="clave">Contraseña</label>
                <input id="clave" name="password" type="password" placeholder="••••••••" required />

                <button type="submit" class="btn">Entrar</button>
            </form>
            <p class="ayuda">
                ¿No tienes cuenta?
                <a class="link" th:href="@{/register}">Crear cuenta</a>
            </p>
        </div>
        <div class="panel-info">
            <ul class="circles"><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul>
            <div class="info-contenido">
                <img th:src="@{/img/logo.png}" src="../static/img/logo.png}" alt="Logo Proyecto" class="logo-proyecto" />

                <p class="titulo-proyecto">
                    Sistema Integral de Gestión <br>
                    del <strong>Desarrollo Personal</strong>
                </p>
            </div>
        </div>
    </div>
    <p class="footer">Proyecto Desarrollo Personal</p>
</div>
</body>
</html>
