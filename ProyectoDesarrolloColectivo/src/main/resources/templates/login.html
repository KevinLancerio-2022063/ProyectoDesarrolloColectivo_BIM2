<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Desarrollo Colectivo</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="../static/css/estilos.css" />
</head>
<body>

<div class="contenedor">
    <h1 class="titulo">Desarrollo Colectivo</h1>

    <div class="tarjeta">
        <h2 class="subtitulo">Iniciar sesión</h2>

        <p th:if="${error}" th:text="${error}" style="color: #d9534f; font-size: 14px; margin-bottom: 10px;"></p>

        <form class="formulario" th:action="@{/login}" method="post">
            <label for="correo">Correo</label>
            <input id="correo" name="usuario" type="email" placeholder="tu@correo.com" required />

            <label for="clave">Contraseña</label>
            <input id="clave" name="password" type="password" placeholder="••••••••" required />

            <button type="submit" class="btn">Entrar</button>
        </form>


        <p class="ayuda">
            ¿No tienes cuenta?
            <a class="link" th:href="@{/register}">Crear cuenta</a>
        </p>
    </div>

    <p class="footer">Proyecto Desarrollo Personal</p>
</div>

</body>
</html>
