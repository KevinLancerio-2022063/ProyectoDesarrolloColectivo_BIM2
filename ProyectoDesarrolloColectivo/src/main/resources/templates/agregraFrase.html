<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Frase</title>
</head>
<body>
    <nav>
        <a th:href="@{/}" class="nav-logo">Evoluciona</a>
        <ul class="nav-links">
            <li><a th:href="@{/}">Inicio</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <div class="page-header-left">
            <div class="page-tag">Bienestar personal</div>
            <h1 class="page-title">Frase <em>Motivadora</em></h1>
        </div>
    </div>

    <div class="detalle-container">

        <div class="detalle-card">

            <div class="detalle-header">
                <h1 class="detalle-titulo">Nueva Frase Motivadora</h1>
            </div>

            <form th:action="@{/guardarFraseCreada}" th:object="${frase}" method="post" class="frase-form">
                <div class="form-group">
                    <label for="texto">Texto:</label>
                    <textarea id="texto" th:field="*{texto}" required></textarea>
                </div>
                <div class="form-group">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" th:field="*{autor}" required>
                </div>
                <button type="submit" class="btn-primary">Guardar Frase</button>
            </form>
        </div>
    </div>
</body>
</html>
