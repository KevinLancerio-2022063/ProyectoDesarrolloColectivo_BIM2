<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Perfil Nutricional</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" th:href="@{/Base.css}">
    <link rel="stylesheet" th:href="@{/PerfilNutricional.css}">
</head>
<body>

<nav>
  <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
  <ul class="nav-links">
    <li><a th:href="@{/index}">Inicio</a></li>
  </ul>
</nav>

<div th:if="${exito}" class="alerta" th:text="${exito}"></div>

<div class="page-header">
  <div class="page-header-left">
    <div class="page-tag">Salud y bienestar</div>
    <h1 class="page-title">Perfil <em>Nutricional</em></h1>
  </div>
  <button class="btn-primary">＋ Nuevo perfil</button>
</div>

<div class="perfiles-container">

  <div class="perfil-hero">
    <div class="perfil-hero-info">
      <h2>1 perfil registrado</h2>
      <p>Gestiona los perfiles nutricionales de tus usuarios</p>
    </div>
    <div class="perfil-hero-stats">
      <div class="phs-item">
        <div class="phs-num">1</div>
        <div class="phs-label">Perfiles</div>
      </div>
      <div class="phs-item">
        <div class="phs-num">70</div>
        <div class="phs-label">Peso prom. kg</div>
      </div>
      <div class="phs-item">
        <div class="phs-num">25</div>
        <div class="phs-label">Edad prom.</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <form th:action="@{/perfilNutricional/buscarPerfilNutricional}" method="get" style="display:contents;">
      <div class="search-wrap">
        <input type="number" name="id" class="search-input" placeholder="Buscar por ID"/>
      </div>
    </form>

    <span style="font-size:0.82rem;opacity:0.5;margin-left:auto;"
          th:text="${#lists.size(perfilNutricional)} + ' perfil(es)'">
    </span>
  </div>

  <div class="perfiles-grid">

    <div class="perfil-card" th:each="perfilNutri : ${perfilNutricional}">

      <div class="perfil-card-top">
        <div class="perfil-card-avatar">U</div>
        <div class="perfil-card-avatar"
             th:text="${#strings.substring(perfilNutri.genero,0,1)}">U</div>

        <div>
          <div class="perfil-card-user"
               th:text="'Usuario #' + ${perfilNutri.fk_id_usuario}"></div>

          <div class="perfil-card-id"
               th:text="'Perfil #' + ${perfilNutri.id_perfil_nutricional}"></div>
        </div>
      </div>

      <div class="perfil-card-body">

        <div class="perfil-metrics">
          <div class="metric-item">
            <div class="metric-val"
                 th:text="${perfilNutri.peso_kg} + ' kg'"></div>
            <div class="metric-label">Peso</div>
          </div>

          <div class="metric-item">
            <div class="metric-val"
                 th:text="${perfilNutri.altura} + ' m'"></div>
            <div class="metric-label">Altura</div>
          </div>

          <div class="metric-item">
            <div class="metric-val"
                 th:text="${perfilNutri.edad} + ' años'"></div>
            <div class="metric-label">Edad</div>
          </div>
        </div>

        <div class="perfil-tags">
          <span class="perfil-tag" th:text="${perfilNutri.genero}"></span>
          <span class="perfil-tag" th:text="'Nivel: ' + ${perfilNutri.nivel_actividad}"></span>
          <span class="perfil-tag" th:text="${perfilNutri.objetivo}"></span>
        </div>
      </div>
      <div class="perfil-card-footer">
        <button class="btn-icon btn-edit">✏️</button>
        <button class="btn-icon btn-delete">🗑️</button>
      </div>
    </div>

  </div>
</div>

<div class="form-section-wrap">
  <div class="form-section">
    <div class="form-section-header">
      <h2 class="form-section-title">Nuevo <em>Perfil Nutricional</em></h2>
      <p class="form-section-sub">Registra los datos físicos y objetivo nutricional del usuario.</p>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Peso (kg)</label>
        <input type="number" class="form-input" placeholder="70" min="1" max="500"/>
      </div>
      <div class="form-group">
        <label class="form-label">Altura (m)</label>
        <input type="number" class="form-input" placeholder="1.75" step="0.01" min="0.50" max="2.50"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Edad</label>
        <input type="number" class="form-input" placeholder="25" min="12" max="120"/>
      </div>
      <div class="form-group">
        <label class="form-label">Género</label>
        <select class="form-select">
          <option value="">Seleccionar...</option>
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Nivel de actividad</label>
      <select class="form-select">
        <option value="">Seleccionar...</option>
        <option value="bajo">Bajo — Sedentario</option>
        <option value="medio">Medio — Activo moderado</option>
        <option value="alto">Alto — Muy activo</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Objetivo</label>
      <input type="text" class="form-input" placeholder="Ej. Bajar de peso" maxlength="75"/>
    </div>

    <div class="form-group">
      <label class="form-label">Usuario (ID)</label>
      <input type="number" class="form-input" placeholder="ID del usuario" min="1"/>
    </div>

    <div class="form-actions">
      <button class="btn-secondary">Cancelar</button>
      <button class="btn-primary">Guardar perfil</button>
    </div>
  </div>
</div>

</body>
</html>
