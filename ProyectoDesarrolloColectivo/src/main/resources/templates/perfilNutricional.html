<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Perfil Nutricional</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" th:href="@{/Base.css}">
    <link rel="stylesheet" th:href="@{/PerfilNutricional.css}">
</head>
<body>

<nav>
  <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
  <ul class="nav-links">
    <li><a th:href="@{/index}">Inicio</a></li>
  </ul>
</nav>

<div th:if="${exito}" class="alerta" th:text="${exito}"></div>

<div class="page-header">
  <div class="page-header-left">
    <div class="page-tag">Salud y bienestar</div>
    <h1 class="page-title">Perfil <em>Nutricional</em></h1>
  </div>
    <button class="btn-primary">＋ Nuevo perfil</button>
</div>

<div class="perfiles-container">

  <div class="toolbar">
    <form th:action="@{/perfilNutricional/buscarPerfilNutricional}" method="get" style="display:contents;">
      <div class="search-wrap">
        <input type="number" name="id" class="search-input" placeholder="Buscar por ID"/>
      </div>
    </form>

    <span style="font-size:0.82rem;opacity:0.5;margin-left:auto;"
          th:text="${#lists.size(perfilNutricional)} + ' perfil(es)'">
    </span>
  </div>

  <div class="perfiles-grid">

    <div class="perfil-card" th:each="perfilNutri : ${perfilNutricional}">

      <div class="perfil-card-top">
        <div class="perfil-card-avatar"
             th:text="${#strings.substring(perfilNutri.genero,0,1)}">U</div>

        <div>
          <div class="perfil-card-user"
               th:text="'Usuario #' + ${perfilNutri.fk_id_usuario}"></div>

          <div class="perfil-card-id"
               th:text="'Perfil #' + ${perfilNutri.id_perfil_nutricional}"></div>
        </div>
      </div>

      <div class="perfil-card-body">

        <div class="perfil-metrics">
          <div class="metric-item">
            <div class="metric-val"
                 th:text="${perfilNutri.peso_kg} + ' kg'"></div>
            <div class="metric-label">Peso</div>
          </div>

          <div class="metric-item">
            <div class="metric-val"
                 th:text="${perfilNutri.altura} + ' m'"></div>
            <div class="metric-label">Altura</div>
          </div>

          <div class="metric-item">
            <div class="metric-val"
                 th:text="${perfilNutri.edad} + ' años'"></div>
            <div class="metric-label">Edad</div>
          </div>
        </div>

        <div class="perfil-tags">
          <span class="perfil-tag" th:text="${perfilNutri.genero}"></span>
          <span class="perfil-tag" th:text="'Nivel: ' + ${perfilNutri.nivel_actividad}"></span>
          <span class="perfil-tag" th:text="${perfilNutri.objetivo}"></span>
        </div>

      </div>

      <div class="perfil-card-footer">
        <a th:href="@{/perfilNutricional/editarPerfilNutricional/{id}(id=${perfilNutri.id_perfil_nutricional})}"
           class="btn-icon btn-edit">✏️</a>

        <form th:action="@{/perfilNutricional/eliminarPerfilNutricional/{id}(id=${perfilNutri.id_perfil_nutricional})}"
              method="post" style="display:inline;">
          <button type="submit" class="btn-icon btn-delete">🗑️</button>
        </form>
      </div>

    </div>

  </div>
</div>

<!-- FORMULARIO -->
<div class="form-section-wrap">
  <div class="form-section">

    <form th:action="${perfilNutricionalFormu.id_perfil_nutricional != null}
                      ? @{/perfilNutricional/actualizarPerfilNutricional/{id}(id=${perfilNutricionalFormu.id_perfil_nutricional})}
                      : @{/perfilNutricional/guardarPerfilNutricional}"
          method="post"
          th:object="${perfilNutricionalFormu}">

      <div class="form-section-header">
        <h2 class="form-section-title">
          <span th:if="${perfilNutricionalFormu.id_perfil_nutricional != null}">
            Editar <em>Perfil</em>
          </span>
          <span th:unless="${perfilNutricionalFormu.id_perfil_nutricional != null}">
            Nuevo <em>Perfil</em>
          </span>
        </h2>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Peso</label>
          <input type="number" th:field="*{peso_kg}" class="form-input"/>
          <span th:errors="*{peso_kg}" class="error"></span>
        </div>

        <div class="form-group">
          <label>Altura</label>
          <input type="number" step="0.01" th:field="*{altura}" class="form-input"/>
          <span th:errors="*{altura}" class="error"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Edad</label>
          <input type="number" th:field="*{edad}" class="form-input"/>
          <span th:errors="*{edad}" class="error"></span>
        </div>

        <div class="form-group">
          <label>Género</label>
          <select th:field="*{genero}" class="form-select">
            <option value="">Seleccionar género</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
          </select>
          <span th:errors="*{genero}" class="error"></span>
        </div>
      </div>

      <div class="form-group">
        <label>Nivel de actividad</label>
        <select th:field="*{nivel_actividad}" class="form-select">
          <option value="">Nivel de actividad</option>
          <option value="bajo">Bajo</option>
          <option value="medio">Medio</option>
          <option value="alto">Alto</option>
        </select>
        <span th:errors="*{nivel_actividad}" class="error"></span>
      </div>

      <div class="form-group">
        <label>Objetivo</label>
        <input type="text" th:field="*{objetivo}" class="form-input"/>
        <span th:errors="*{objetivo}" class="error"></span>
      </div>

      <div class="form-group">
        <label>ID Usuario</label>
        <input type="number" th:field="*{fk_id_usuario}" class="form-input"/>
        <span th:errors="*{fk_id_usuario}" class="error"></span>
      </div>

      <div class="form-actions">
        <a th:href="@{/perfilNutricional}" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-primary"
                th:text="${perfilNutricionalFormu.id_perfil_nutricional != null} ? 'Actualizar' : 'Guardar'">
        </button>
      </div>

    </form>

  </div>
</div>

</body>
</html>
