<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agregar Apoyo Emocional</title>
    <link rel="stylesheet" th:href="@{/css/Base.css}">
    <link rel="stylesheet" th:href="@{/css/ApoyoEmocional.css}">
</head>
<body>
    <nav>
        <a th:href="@{/}" class="nav-logo">Evoluciona</a>
        <ul class="nav-links">
            <li><a th:href="@{/}">Inicio</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <div class="page-header-left">
            <div class="page-tag">Bienestar personal</div>
            <h1 class="page-title">Apoyo <em>Emocional</em></h1>
        </div>
    </div>

    <div class="detalle-container">

        <div class="detalle-card">

            <div class="detalle-header">
                <h1 class="detalle-titulo">Nuevo Apoyo Emocional</h1>
            </div>

            <form th:action="@{/guardarApoyoCreado}" th:object="${apoyo}" method="post" class="apoyo-form">
                <div class="form-group">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" th:field="*{titulo}" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" th:field="*{categoria}" required>
                        <option value="">Seleccionar...</option>
                        <option value="Tristeza">Tristeza</option>
                        <option value="Ansiedad">Ansiedad</option>
                        <option value="Ira">Ira</option>
                        <option value="Bienestar">Bienestar</option>
                        <option value="Autoestima">Autoestima</option>
                        <option value="Estrés">Estrés</option>
                        <option value="Soledad">Soledad</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="contenido">Contenido:</label>
                    <textarea id="contenido" th:field="*{contenido}" required></textarea>
                </div>
                <div class="form-group">
                    <label for="nivelAnimo">Nivel de ánimo:</label>
                    <select id="nivelAnimo" th:field="*{nivelAnimo}" required>
                        <option value="">Seleccionar...</option>
                        <option value="Mal">Mal</option>
                        <option value="Bien">Bien</option>
                        <option value="Mas o menos">Mas o menos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="usuario">Usuario ID:</label>
                    <select id="usuario" th:field="*{usuario}" required>
                        <option value="">Seleccionar...</option>
                        <option th:each="user : ${usuario}" th:value="${user.id_usuario}" th:text="${user.nombre_completo}"></option>
                    </select>
                </div>
                <div class="detalle-footer">
                    <button type="submit" class="btn-guardar">
                        <div class="btn-guardar-slider">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20" width="20"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
                                <path d="m19,21H5c-1.1,0-2-.9-2-2V5c0-1.1.9-2,2-2h11l5,5v11c0,1.1-.9,2-2,2Z"
                                    data-path="box"></path>
                                <path d="M7 3L7 8L15 8" data-path="line-top"></path>
                                <path d="M17 20L17 13L7 13L7 20" data-path="line-bottom"></path>
                            </svg>
                        </div>
                        <span class="btn-guardar-text">Guardar</span>
                    </button>
                    <a th:href="@{/apoyoEmocional}" class="btn-secondary">Cancelar</a>
                </div>
            </form>

        </div>

    </div>

    <!-- Modal de Error -->
    <div th:if="${error}" class="modal-overlay modal-error">
        <div class="modal-container">

        <div class="modal-body">
            <div class="modal-content">

            <div class="modal-icon">
                ⚠
            </div>

            <div class="modal-text">
                <h3>Error</h3>
                <p th:text="${error}"></p>
            </div>

            </div>
        </div>

        <div class="modal-footer">
            <a th:href="@{/agregarApoyo}" class="btn-danger">aceptar</a>
        </div>

        </div>

    </div>

</body>
</html>
