<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Objetivo Meditación</title>
    <link rel="stylesheet" th:href="@{/css/baseLancerio.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
<nav>
    <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
        <li><a th:href="@{/index}">Inicio</a></li>
    </ul>
</nav>

<div class="usuario-container">

    <!-- Encabezado con el texto "Objetivos de Meditación" -->
    <div class="page-header">
        <h1 class="page-title">
            Objetivos de <em>Meditación</em>
        </h1>
    </div>

    <!-- Este es la opcion para buscar por ID los Objetivos -->
    <div class="toolbar">

        <div class="search-wrap">     <!-- Ícono de la lupa del buscar -->
            <span class="search-icon"><i class="bi bi-search"></i></span>
            <input type="text"
                   id="buscar"
                   class="search-input"
                   placeholder="Buscar objetivo..."
                   onkeyup="filtrarTabla()">
        </div>

        <!-- Con esto, al darle el botón te mandara a la "vista" que permitira ingresar los datos para agregar el Objetivo -->
        <button class="btn-primary"
                onclick="window.location.href='/objetivoMeditacion'">
            + Nuevo objetivo
        </button>

    </div>

    <!-- Grid donde se muestran los objetivos -->
    <div class="usuarios-grid" id="tablaObjetivos">

        <div class="usuario-card"
             th:each="o : ${objetivos}"
             th:attr="data-id=${o.id_objetivo_meditacion}">

            <div class="card-header">

                <!-- Avatar simple -->
                <div class="usuario-avatar">OM</div>

                <div class="card-actions">

                    <a class="btn-icon btn-edit"
                       th:href="@{/objetivoMeditacion/editar/{id}(id=${o.id_objetivo_meditacion})}">
                        <!-- Ícono del lápiz -->
                        <i class="bi bi-pencil"></i>
                    </a>

                    <a class="btn-icon btn-delete"
                       href="#"
                       th:attr="onclick=|openModal('/objetivoMeditacion/eliminar/${o.id_objetivo_meditacion}')|">
                        <!-- Ícono del bote de basura -->
                        <i class="bi bi-trash-fill"></i>
                    </a>

                </div>

            </div>

            <div class="card-body">
                <p><strong>Tiempo:</strong> <span th:text="${o.tiempo_objetivo}"></span></p>
                <p><strong>Días:</strong> <span th:text="${o.dias_objetivo}"></span></p>
                <p><strong>Usuario:</strong> <span th:text="${o.fk_id_usuario}"></span></p>
            </div>

            <div class="card-footer">
                <span class="card-id"
                      th:text="'#' + ${o.id_objetivo_meditacion}">
                </span>
            </div>

        </div>

        <!-- Estado vacío -->
        <div class="card-empty"
             th:if="${#lists.isEmpty(objetivos)}">
            <p>No hay objetivos registrados</p>
        </div>

    </div>

    <!-- Tarjetas de Errores -->
    <div th:if="${errores != null}" class="error-container">

        <div class="card error-card" th:each="err : ${errores}">
            <div class="header">      <!-- Ícono de Equis -->
                <div class="image"><i class="bi bi-x"></i></div>
                <div class="content">
                    <span class="title">Error</span>
                    <p class="message" th:text="${err}"></p>
                </div>
            </div>
        </div>

    </div>

    <!-- Tarjetas de Éxito -->
    <div th:if="${success}" class="error-container">

        <div class="card success-card">
            <div class="header">       <!-- Ícono de Cheque -->
                <div class="image"><i class="bi bi-check-lg"></i></div>
                <div class="content">
                    <span class="title">Operación exitosa</span>
                    <p class="message" th:text="${success}"></p>
                </div>
            </div>
        </div>

    </div>

    <!-- formulario para ingresar los datos de los Objetivos -->
    <div class="form-section-wrap">

        <div class="form-section">

            <h2 class="form-title"
                th:text="${objetivo.id_objetivo_meditacion != null} ? 'Editar Objetivo' : 'Nuevo Objetivo'">
            </h2>

            <form th:action="@{/objetivoMeditacion/guardar}"
                  th:object="${objetivo}"
                  method="post">

                <input type="hidden" th:field="*{id_objetivo_meditacion}">

                <input class="form-input"
                       type="text"
                       th:field="*{tiempo_objetivo}"
                       placeholder="Tiempo objetivo"
                       required>

                <input class="form-input"
                       type="number"
                       th:field="*{dias_objetivo}"
                       placeholder="Días objetivo"
                       min="1"
                       required>

                <select class="form-input" th:field="*{fk_id_usuario}" required>

                    <option value="">Seleccione un usuario</option>

                    <option th:each="u : ${usuarios}"
                            th:value="${u.id_usuario}"
                            th:text="'ID: ' + ${u.id_usuario} + ' - ' + ${u.nombre_completo}">
                    </option>

                </select>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <span th:text="${objetivo.id_objetivo_meditacion != null} ? 'Actualizar' : 'Guardar'"></span>
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

<!-- Modal del Eliminar -->
<div id="confirmModal" class="modal hidden">
    <div class="card confirm-card">

        <div class="header">        <!-- Ícono de Peligro -->
            <div class="image"><i class="bi bi-exclamation-triangle text-danger"></i></div>

            <div class="content">
                <span class="title">¿Eliminar objetivo?</span>
                <p class="message">Esta acción no se puede deshacer</p>
            </div>
        </div>

        <div class="actions">
            <button id="btnDelete" class="desactivate">
                Eliminar
            </button>

            <button onclick="closeModal()" class="cancel">
                Cancelar
            </button>
        </div>

    </div>
</div>


<!-- Buscador del Objetivo Meditación por Id y el modal -->
<script
    th:src="@{/js/objetivoMeditacion.js}">
</script>

</body>
</html>
