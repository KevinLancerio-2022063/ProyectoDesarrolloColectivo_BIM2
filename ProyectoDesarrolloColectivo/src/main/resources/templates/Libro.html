<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Libro</title>
    <link rel="stylesheet" th:href="@{/Libro.css}">
    <link rel="stylesheet" th:href="@{/Base.css}">
</head>
<body>

<nav>
    <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
</nav>

<div th:if="${exito}" class="alerta" th:text="${exito}"></div>

<div class="page-header">
    <h1>Mis Lecturas</h1>
</div>

<div class="libros-container">

    <form th:action="@{/libro/buscarLibro}" method="get">
        <input type="number" name="id" placeholder="Buscar por id"/>
        <button type="submit">Buscar</button>
    </form>

    <span th:text="${#lists.size(libros)} + ' libro(s)'"></span>

    <div class="libros-grid">

        <div class="libro-card" th:each="l : ${libros}">

            <div class="libro-spine"
                 th:classappend="${l.estado == 'leyendo'} ? ' leyendo' :
                                 (${l.estado == 'terminado'} ? ' terminado' : '')">
            </div>

            <div class="libro-cover">
                <div class="libro-icon">📚</div>

                <div class="libro-meta">
                    <div th:text="${l.titulo_libro}"></div>
                    <div th:text="${l.autor_libro}"></div>

                    <span th:text="${l.estado}"></span>
                </div>
            </div>

            <div class="libro-footer">
                <span>Usuario <strong th:text="${l.fk_id_usuario}"></strong></span>

                <a th:href="@{/libro/editarLibro/{id}(id=${l.id_libro})}">✏️</a>

                <form th:action="@{/libro/eliminarLibro/{id}(id=${l.id_libro})}" method="post">
                    <button type="submit">🗑️</button>
                </form>
            </div>

        </div>

    </div>
</div>

<form th:object="${librosFormu}"
      th:action="${librosFormu.id_libro != null} ?
      @{/libro/actualizarLibro/{id}(id=${librosFormu.id_libro})} :
      @{/libro/guardarLibro}"
      method="post">

    <h2 th:text="${librosFormu.id_libro != null} ? 'Editar Libro' : 'Nuevo Libro'"></h2>

    <input type="text" th:field="*{titulo_libro}" placeholder="Título"/>
    <span th:errors="*{titulo_libro}"></span>

    <input type="text" th:field="*{autor_libro}" placeholder="Autor"/>
    <span th:errors="*{autor_libro}"></span>

    <select th:field="*{estado}">
        <option value="">Seleccionar</option>
        <option value="pendiente">Pendiente</option>
        <option value="leyendo">Leyendo</option>
        <option value="terminado">Terminado</option>
    </select>
    <span th:errors="*{estado}"></span>

    <input type="number" th:field="*{cantidad_pag}" placeholder="Total páginas"/>
    <span th:errors="*{cantidad_pag}"></span>

    <input type="number" th:field="*{cantidad_leido}" placeholder="Leídas"/>
    <span th:errors="*{cantidad_leido}"></span>

    <input type="number" th:field="*{fk_id_usuario}" placeholder="Usuario"/>
    <span th:errors="*{fk_id_usuario}"></span>

    <button type="submit"
            th:text="${librosFormu.id_libro != null} ? 'Actualizar' : 'Guardar'">
    </button>

</form>

</body>
</html>
