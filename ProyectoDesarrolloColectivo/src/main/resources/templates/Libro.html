<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <title>Libro</title>
    <link rel="stylesheet" th:href="@{/Base.css}">
    <link rel="stylesheet" th:href="@{/Libro.css}">
</head>
<body>

<nav>
    <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
        <li><a th:href="@{/index}">Inicio</a></li>
    </ul>
</nav>

<div th:if="${exito}" class="alerta" th:text="${exito}"></div>

<div class="page-header">
    <h1>Mis Lecturas</h1>
</div>

<div class="libros-container">

    <div class="toolbar">
        <div class="search-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="number" name="id" class="search-input" placeholder="Buscar por ID..."/>
        </div>
        <form th:action="@{/libro/buscarLibro}" method="get" class="search-wrap">
            <input type="number" name="id" class="search-input" placeholder="Buscar por Id"/>
        </form>

        <span th:text="${#lists.size(libros)} + ' libro(s)'"></span>
    </div>

    <div class="libros-grid">

        <div class="libro-card" th:each="libro : ${libros}">

            <div class="libro-spine"
                 th:classappend="${libro.estado}">
            </div>

            <div class="libro-cover">

                <div class="libro-icon">📚</div>

                <div class="libro-meta">

                    <div class="libro-titulo"
                         th:text="${libro.titulo_libro}">
                    </div>

                    <div class="libro-autor"
                         th:text="${libro.autor_libro}">
                    </div>

                    <span class="libro-estado-badge"
                          th:classappend="
                          ${libro.estado == 'pendiente'} ? 'badge-pendiente' :
                          (${libro.estado == 'leyendo'} ? 'badge-leyendo' : 'badge-terminado')"
                          th:text="${libro.estado}">
                    </span>

                </div>
            </div>

            <div class="libro-progreso">
                <div class="progreso-texto">
                    <span th:text="${libro.cantidad_leido} + ' / ' + ${libro.cantidad_pag}"></span>
                    <span th:text="${(libro.cantidad_leido * 100) / libro.cantidad_pag} + '%'"></span>
                </div>

                <div class="progreso-bar">
                    <div class="progreso-fill"
                         th:style="'width:' + ${(libro.cantidad_leido * 100) / libro.cantidad_pag} + '%'"
                         th:classappend="${libro.estado == 'terminado'} ? 'completo'">
                    </div>
                </div>
            </div>

            <div class="libro-footer">
                <span>Usuario <strong th:text="${l.fk_id_usuario}"></strong></span>

                <span class="libro-footer-stat">
                    Usuario <strong th:text="${libro.fk_id_usuario}"></strong>
                </span>

                <div class="libro-actions">
                    <a th:href="@{/libro/editarLibro/{id}(id=${libro.id_libro})}">✏️</a>

                    <form th:action="@{/libro/eliminarLibro/{id}(id=${libro.id_libro})}" method="post">
                        <button type="submit">🗑️</button>
                    </form>
                </div>

        </div>

    </div>
</div>
<form th:object="${librosFormu}"
      th:action="${librosFormu.id_libro != null} ?
      @{/libro/actualizarLibro/{id}(id=${librosFormu.id_libro})} :
      @{/libro/guardarLibro}"
      method="post">

    <h2 th:text="${librosFormu.id_libro != null} ? 'Editar Libro' : 'Nuevo Libro'"></h2>

    <input type="text" th:field="*{titulo_libro}" placeholder="Título"/>
    <span th:errors="*{titulo_libro}"></span>

    <input type="text" th:field="*{autor_libro}" placeholder="Autor"/>
    <span th:errors="*{autor_libro}"></span>

    <select th:field="*{estado}">
        <option value="">Seleccionar</option>
        <option value="pendiente">Pendiente</option>
        <option value="leyendo">Leyendo</option>
        <option value="terminado">Terminado</option>
    </select>
    <span th:errors="*{estado}"></span>

    <input type="number" th:field="*{cantidad_pag}" placeholder="Total páginas"/>
    <span th:errors="*{cantidad_pag}"></span>

    <input type="number" th:field="*{cantidad_leido}" placeholder="Leídas"/>
    <span th:errors="*{cantidad_leido}"></span>

    <input type="number" th:field="*{fk_id_usuario}" placeholder="Usuario"/>
    <span th:errors="*{fk_id_usuario}"></span>

    <button type="submit"
            th:text="${librosFormu.id_libro != null} ? 'Actualizar' : 'Guardar'">
    </button>

</form>

</body>
</html>
