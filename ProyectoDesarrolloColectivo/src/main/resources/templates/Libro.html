<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Mis Lecturas</title>
    <link rel="stylesheet" th:href="@{/Base.css}">
    <link rel="stylesheet" th:href="@{/Libro.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script th:src="@{/js/alertas.js}" defer></script>
</head>
<body>

<span id="toast-msg" th:if="${exito}" th:text="${exito}" style="display:none;"></span>

<div id="toast" class="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span id="toast-text"></span>
</div>

<div id="modal-overlay-confirmar" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">¿Confirmar eliminación?</h3>
            <button id="btn-cancelar-eliminar" class="modal-close">✕</button>
        </div>
        <p class="modal-body-texto">¿Estás seguro de que deseas eliminar este registro?
        </p>
        <div class="modal-acciones">
            <button id="btn-cancelar-eliminar-2" class="btn-secondary"
                    onclick="document.getElementById('modal-overlay-confirmar').classList.remove('open')">
                Cancelar
            </button>
            <button id="btn-confirmar-eliminar" class="btn-primary"
                    style="background:#C4684A;">
                Sí, eliminar
            </button>
        </div>
    </div>
</div>

<nav>
    <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
        <li><a th:href="@{/index}">Inicio</a></li>
    </ul>
</nav>


<div class="page-header">
    <div class="page-header-left">
        <div class="page-tag">Lectura y progreso</div>
        <h1 class="page-title">Mis <em>Lecturas</em></h1>
    </div>
</div>

<div class="libros-container">

    <div class="toolbar">
        <form th:action="@{/libro/buscarLibro}" method="get" style="display:contents;">
            <div class="search-wrap">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="number" name="id" class="search-input" placeholder="Buscar por ID..."/>
            </div>
        </form>
        <span style="font-size:0.82rem;opacity:0.5;margin-left:auto;"
              th:text="${libros != null ? #lists.size(libros) : 0} + ' libro(s)'"></span>
    </div>

    <div class="libros-grid">

        <div class="libro-card" th:each="libro : ${libros != null ? libros : T(java.util.Collections).emptyList()}">

            <div class="libro-spine"
                 th:classappend="${libro.estado == 'leyendo'} ? 'leyendo' : (${libro.estado == 'terminado'} ? 'terminado' : '')">
            </div>

            <div class="libro-cover">
                <div class="libro-icon"><svg xmlns="http://www.w3.org/2000/svg" height="34px" viewBox="0 -960 960 960" width="34px" fill="#1f1f1f"><path d="M240-80q-50 0-85-35t-35-85v-560q0-50 35-85t85-35h440v640H240q-17 0-28.5 11.5T200-200q0 17 11.5 28.5T240-160h520v-640h80v720H240Zm120-240h240v-480H360v480Zm-80 0v-480h-40q-17 0-28.5 11.5T200-760v447q10-3 19.5-5t20.5-2h40Zm-80-480v487-487Z"/></svg></div>
                <div class="libro-meta">
                    <div class="libro-titulo" th:text="${libro.titulo_libro}">Título</div>
                    <div class="libro-autor"  th:text="${libro.autor_libro}">Autor</div>
                    <span class="libro-estado-badge"
                          th:classappend="${libro.estado == 'pendiente'} ? 'badge-pendiente' :
                                         (${libro.estado == 'leyendo'}  ? 'badge-leyendo'   : 'badge-terminado')"
                          th:text="${libro.estado}">estado</span>
                </div>
            </div>

            <div class="libro-progreso">
                <div class="progreso-texto">
                    <span th:text="${libro.cantidad_leido} + ' / ' + ${libro.cantidad_pag} + ' págs'"></span>
                    <span th:text="${libro.cantidad_pag > 0} ? ${(libro.cantidad_leido * 100) / libro.cantidad_pag} + '%' : '0%'"></span>
                </div>
                <div class="progreso-bar">
                    <div class="progreso-fill"
                         th:style="'width:' + (${libro.cantidad_pag > 0} ? ${(libro.cantidad_leido * 100) / libro.cantidad_pag} : 0) + '%'"
                         th:classappend="${libro.estado == 'terminado'} ? 'completo'">
                    </div>
                </div>
            </div>

            <div class="libro-footer">
                <span class="libro-footer-stat">
                    Usuario <strong th:text="'#' + ${libro.fk_id_usuario}"></strong>
                </span>
                <div class="libro-actions">
                    <a th:href="@{/libro/editarLibro/{id}(id=${libro.id_libro})}"
                       class="btn-icon btn-edit"><i class="bi bi-pencil-square"></i></a>
                    <form class="form-eliminar" th:action="@{/libro/eliminarLibro/{id}(id=${libro.id_libro})}" method="post" style="display:inline;">
                        <button type="submit" class="btn-icon btn-delete"><i class="bi bi-trash-fill"></i></button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="form-section-wrap">
    <div class="form-section">

        <div class="form-section-header">
            <h2 class="form-section-title">
                <span th:if="${librosFormu.id_libro != null}">Editar <em>Libro</em></span>
                <span th:unless="${librosFormu.id_libro != null}">Nuevo <em>Libro</em></span>
            </h2>
            <p class="form-section-sub">Completa la información y lleva el control de tu progreso lector.</p>
        </div>

        <form th:object="${librosFormu}"
              th:action="${librosFormu.id_libro != null
                  ? '/libro/actualizarLibro/' + librosFormu.id_libro
                  : '/libro/guardarLibro'}"
              method="post">

            <input type="hidden" th:field="*{id_libro}"/>

            <div class="form-group">
                <label class="form-label">Título del libro</label>
                <input type="text" th:field="*{titulo_libro}" class="form-input"
                       placeholder="Ej. El Principito"/>
                <span th:errors="*{titulo_libro}" class="error"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Autor</label>
                <input type="text" th:field="*{autor_libro}" class="form-input"
                       placeholder="Ej. Antoine de Saint-Exupéry"/>
                <span th:errors="*{autor_libro}" class="error"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Estado</label>
                <select th:field="*{estado}" class="form-select">
                    <option value="">Seleccionar estado</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="leyendo">Leyendo</option>
                    <option value="terminado">Terminado</option>
                </select>
                <span th:errors="*{estado}" class="error"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Total de páginas</label>
                    <input type="number" th:field="*{cantidad_pag}" class="form-input"
                           placeholder="300"/>
                    <span th:errors="*{cantidad_pag}" class="error"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Páginas leídas</label>
                    <input type="number" th:field="*{cantidad_leido}" class="form-input"
                           placeholder="0"/>
                    <span th:errors="*{cantidad_leido}" class="error"></span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">ID de usuario</label>
                <input type="number" th:field="*{fk_id_usuario}" class="form-input"
                       placeholder="ID del usuario"/>
                <span th:errors="*{fk_id_usuario}" class="error"></span>
            </div>

            <div class="form-actions">
                <a th:href="@{/libro}" class="btn-secondary">Cancelar</a>
                <button type="submit" class="btn-primary"
                        th:text="${librosFormu.id_libro != null} ? 'Actualizar libro' : 'Guardar libro'">
                    Guardar
                </button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
