<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Mis Lecturas</title>
    <link rel="stylesheet" th:href="@{/Base.css}">
    <link rel="stylesheet" th:href="@{/Libro.css}">
</head>
<body>

<nav>
    <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
        <li><a th:href="@{/index}">Inicio</a></li>
    </ul>
</nav>

<div th:if="${exito}" class="alerta" th:text="${exito}"></div>

<div class="page-header">
    <div class="page-header-left">
        <div class="page-tag">Lectura y progreso</div>
        <h1 class="page-title">Mis <em>Lecturas</em></h1>
    </div>
    <a th:href="@{/libro}" class="btn-primary">＋ Nuevo libro</a>
</div>

<div class="libros-container">

    <div class="toolbar">
        <form th:action="@{/libro/buscarLibro}" method="get" style="display:contents;">
            <div class="search-wrap">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="number" name="id" class="search-input" placeholder="Buscar por ID..."/>
            </div>
        </form>
        <span style="font-size:0.82rem;opacity:0.5;margin-left:auto;"
              th:text="${#lists.size(libros)} + ' libro(s)'">0 libro(s)</span>
    </div>

    <div class="libros-grid">

        <div class="libro-card" th:each="libro : ${libros}">

            <div class="libro-spine"
                 th:classappend="${libro.estado == 'leyendo'} ? 'leyendo' : (${libro.estado == 'terminado'} ? 'terminado' : '')">
            </div>

            <div class="libro-cover">

                <div class="libro-icon">📚</div>

                <div class="libro-meta">
                    <div class="libro-titulo" th:text="${libro.titulo_libro}">Título</div>
                    <div class="libro-autor"  th:text="${libro.autor_libro}">Autor</div>
                    <span class="libro-estado-badge"
                          th:classappend="${libro.estado == 'pendiente'} ? 'badge-pendiente' :
                                         (${libro.estado == 'leyendo'}  ? 'badge-leyendo'   : 'badge-terminado')"
                          th:text="${libro.estado}">estado</span>
                </div>
            </div>

            <div class="libro-progreso">
                <div class="progreso-texto">
                    <span th:text="${libro.cantidad_leido} + ' / ' + ${libro.cantidad_pag} + ' págs'"></span>
                    <span th:text="${libro.cantidad_pag > 0} ? ${(libro.cantidad_leido * 100) / libro.cantidad_pag} + '%' : '0%'"></span>
                </div>

                <div class="progreso-bar">
                    <div class="progreso-fill"
                         th:style="'width:' + (${libro.cantidad_pag > 0} ? ${(libro.cantidad_leido * 100) / libro.cantidad_pag} : 0) + '%'"
                         th:classappend="${libro.estado == 'terminado'} ? 'completo'">
                    </div>
                </div>
            </div>

            <div class="libro-footer">

                <span class="libro-footer-stat">
                    Usuario <strong th:text="${libro.fk_id_usuario}"></strong>
                </span>

                <div class="libro-actions">
                    <a th:href="@{/libro/editarLibro/{id}(id=${libro.id_libro})}">✏️</a>

                    <form th:action="@{/libro/eliminarLibro/{id}(id=${libro.id_libro})}" method="post">
                        <button type="submit">🗑️</button>
                    </form>
                </div>

            </div>

        </div>

    </div>
</div>

<div class="form-section-wrap">

    <div class="form-section">

        <div class="form-section-header">
            <h2 class="form-section-title"
                th:text="${librosFormu.id_libro != null} ? 'Editar Libro' : 'Nuevo Libro'">
            </h2>

            <p class="form-section-sub">
                Completa la información de tu libro y lleva el control de tu progreso.
            </p>
        </div>

        <form th:object="${librosFormu}"
              th:action="${librosFormu.id_libro != null} ?
          @{/libro/actualizarLibro/{id}(id=${librosFormu.id_libro})} :
          @{/libro/guardarLibro}"
              method="post">

            <input type="hidden" th:field="*{id_libro}"/>

            <div class="form-group">
                <label class="form-label">Título</label>
                <input class="form-input" type="text" th:field="*{titulo_libro}" placeholder="Nombre del libro"/>
                <span th:errors="*{titulo_libro}"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Autor</label>
                <input class="form-input" type="text" th:field="*{autor_libro}" placeholder="Autor del libro"/>
                <span th:errors="*{autor_libro}"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Estado</label>
                <select class="form-select" th:field="*{estado}">
                    <option value="">Seleccionar</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="leyendo">Leyendo</option>
                    <option value="terminado">Terminado</option>
                </select>
                <span th:errors="*{estado}"></span>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label class="form-label">Total páginas</label>
                    <input class="form-input" type="number" th:field="*{cantidad_pag}"/>
                    <span th:errors="*{cantidad_pag}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label">Páginas leídas</label>
                    <input class="form-input" type="number" th:field="*{cantidad_leido}"/>
                    <span th:errors="*{cantidad_leido}"></span>
                </div>

            </div>

            <div class="form-group">
                <label class="form-label">Usuario</label>
                <input class="form-input" type="number" th:field="*{fk_id_usuario}"/>
                <span th:errors="*{fk_id_usuario}"></span>
            </div>

            <div class="form-actions">

                <button type="submit" class="btn-primary"
                        th:text="${librosFormu.id_libro != null} ? 'Actualizar' : 'Guardar'">
                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
