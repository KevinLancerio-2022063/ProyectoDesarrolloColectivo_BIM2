<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Objetivo</title>
    <link rel="stylesheet" th:href="@{/Base.css}">
    <link rel="stylesheet" th:href="@{/Objetivos.css}">
</head>
<body>
    <nav>
        <a th:href="@{/}" class="nav-logo">Evoluciona</a>
        <ul class="nav-links">
        <li><a th:href="@{/}">Inicio</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <div class="page-header-left">
        <div class="page-tag">Metas personales</div>
        <h1 class="page-title">Obje<em>tivos</em></h1>
        </div>
    </div>

    <div class="detalle-container">
        <div class="detalle-card">
            <div class="detalle-header">
                <h1 class="detalle-titulo" th:text="${objetivo.tituloObjetivo}"></h1>
            </div>
           
            <form th:action="@{/guardarObjetivo}" th:object="${objetivo}" method="post">
                <input type="hidden" th:field="*{idObjetivos}">
                <div class="form-group">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" th:field="*{tituloObjetivo}" required>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" th:field="*{descripcionObjetivo}" required></textarea>
                </div>
                <div class="form-group">
                    <label for="estado">Estado:</label>
                    <select id="estado" th:field="*{estadoObjetivo}" required>
                        <option value="Pendiente" th:selected="${objetivo.estadoObjetivo == 'Pendiente'}">Pendiente</option>
                        <option value="En progreso" th:selected="${objetivo.estadoObjetivo == 'En progreso'}">En progreso</option>
                        <option value="Completado" th:selected="${objetivo.estadoObjetivo == 'Completado'}">Completado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fechaObjetivo" th:value="${objetivo.fechaObjetivo}" required>
                </div>
                <div class="form-group">
                    <label for="usuario">Usuario:</label>
                    <select id="usuario" th:field="*{usuario.id_usuario}" required>
                        <option value="">Seleccionar...</option>
                        <option th:each="user : ${usuario}" th:value="${user.id_usuario}" th:text="${user.nombre_completo}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fraseMotivadora">Frase motivadora:</label>
                    <select id="fraseMotivadora" th:field="*{fraseMotivadora.idFraseMotivadora}" required>
                        <option value="">Seleccionar...</option>
                        <option th:each="frase : ${frase}" th:value="${frase.idFraseMotivadora}" th:text="${frase.texto}" ></option>
                    </select>
                </div>
                <div class="detalle-footer">
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                    <a th:href="@{/objetivos}" class="btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
