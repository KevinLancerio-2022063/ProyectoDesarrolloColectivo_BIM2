<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de Sueño</title>
    <link rel="stylesheet" th:href="@{/css/baseLancerio.css}">
</head>

<body>
<nav>
    <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
        <li><a th:href="@{/index}">Inicio</a></li>
    </ul>
</nav>

<div class="usuario-container">

    <!-- Encabezado para el texto "Registro Sueño" -->
    <div class="page-header">
        <h1 class="page-title">
            Registro de <em>Sueño</em>
        </h1>
    </div>

    <!-- Bara del buscador para ver los registros por Id -->
    <div class="toolbar">

        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text"
                   id="buscar"
                   class="search-input"
                   placeholder="Buscar registro..."
                   onkeyup="filtrarTabla()">
        </div>

        <button class="btn-primary"
                onclick="window.location.href='/registroSueno'">
            + Nuevo registro
        </button>

    </div>

    <!-- Grid para ver los demás registros del sueño -->
    <div class="usuarios-grid" id="tablaRegistros">

        <div class="usuario-card"
             th:each="r : ${registros}"
             th:attr="data-id=${r.id_registro_sueño}">

            <div class="card-header">
                <div class="usuario-avatar">RS</div>

                <div class="card-actions">
                    <a class="btn-icon"
                       th:href="@{/registroSueno/editar/{id}(id=${r.id_registro_sueño})}">
                        ✏️
                    </a>

                    <a class="btn-icon"
                       th:href="@{/registroSueno/eliminar/{id}(id=${r.id_registro_sueño})}"
                       onclick="return confirm('¿Eliminar registro?')">
                        🗑️
                    </a>
                </div>
            </div>

            <div class="card-body">
                <p><strong>Fecha:</strong> <span th:text="${r.fecha_sueño}"></span></p>
                <p><strong>Horas:</strong> <span th:text="${r.horas_dormidas}"></span></p>
                <p><strong>Calidad:</strong> <span th:text="${r.calidad_sueño}"></span></p>
                <p><strong>Usuario:</strong> <span th:text="${r.fk_id_usuario}"></span></p>
            </div>

            <div class="card-footer">
                <span class="card-id"
                      th:text="'#' + ${r.id_registro_sueño}"></span>
            </div>

        </div>

        <!-- Estado vacío -->
        <div class="card-empty"
             th:if="${#lists.isEmpty(registros)}">
            <p>No hay registros de sueño</p>
        </div>

    </div>

    <!-- Formulario para ingresar un nuevo registro de sueño -->
    <div class="form-section-wrap">

        <div class="form-section">

            <h2 class="form-title"
                th:text="${registro.id_registro_sueño != null} ? 'Editar Registro' : 'Nuevo Registro'">
            </h2>

            <form th:action="@{/registroSueno/guardar}"
                  th:object="${registro}"
                  method="post">

                <input type="hidden" th:field="*{id_registro_sueño}">

                <input class="form-input"
                       type="date"
                       th:field="*{fecha_sueño}"
                       required>

                <input class="form-input"
                       type="number"
                       min="1"
                       max="15"
                       th:field="*{horas_dormidas}"
                       placeholder="Horas dormidas"
                       required>

                <input class="form-input"
                       type="text"
                       th:field="*{calidad_sueño}"
                       placeholder="Calidad del sueño"
                       required>

                <input class="form-input"
                       type="number"
                       th:field="*{fk_id_usuario}"
                       placeholder="ID Usuario"
                       required>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <span th:text="${registro.id_registro_sueño != null} ? 'Actualizar' : 'Guardar'"></span>
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

<!--Dirección del script buscar por id-->
<script th:src="@{/js/buscadorRegistroSueno.js}"></script>

</body>
</html>
