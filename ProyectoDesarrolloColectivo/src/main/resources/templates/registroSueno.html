<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de Sueño</title>
    <link rel="stylesheet" th:href="@{/css/baseLancerio.css}">
</head>

<body>e
<nav>
    <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
        <li><a th:href="@{/index}">Inicio</a></li>
    </ul>
</nav>

<div class="usuario-container">

    <!-- Encabezado para el texto "Registro Sueño" -->
    <div class="page-header">
        <h1 class="page-title">
            Registro de <em>Sueño</em>
        </h1>
    </div>

    <!-- Bara del buscador para ver los registros por Id -->
    <div class="toolbar">

        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text"
                   id="buscar"
                   class="search-input"
                   placeholder="Buscar registro..."
                   onkeyup="filtrarTabla()">
        </div>

        <button class="btn-primary"
                onclick="window.location.href='/registroSueno'">
            + Nuevo registro
        </button>

    </div>

    <!-- Grid para ver los demás registros del sueño -->
    <div class="usuarios-grid" id="tablaRegistros">

        <div class="usuario-card"
             th:each="r : ${registros}"
             th:attr="data-id=${r.id_registro_sueño}">

            <div class="card-header">
                <div class="usuario-avatar">RS</div>

                <div class="card-actions">
                    <a class="btn-icon btn-edit"
                       th:href="@{/registroSueno/editar/{id}(id=${r.id_registro_sueño})}">
                        ✏️
                    </a>

                    <a class="btn-icon btn-delete"
                       href="#"
                       th:attr="onclick=|openModal('/registroSueno/eliminar/${r.id_registro_sueño}')|">
                        🗑️
                    </a>
                </div>
            </div>

            <div class="card-body">

                <p class="card-name">
                    <strong th:text="${r.fecha_sueño}"></strong>
                </p>

                <p class="card-email">
                    🕒 <span th:text="${r.horas_dormidas}"></span> horas
                </p>

                <p class="card-email">
                    🌙 <span th:text="${r.calidad_sueño}"></span>
                </p>

                <p class="card-email">
                    👤 Usuario #<span th:text="${r.fk_id_usuario}"></span>
                </p>

            </div>

            <div class="card-footer">
                <span class="card-id"
                      th:text="'#' + ${r.id_registro_sueño}"></span>
            </div>

        </div>

        <!-- Estado vacío -->
        <div class="card-empty" th:if="${#lists.isEmpty(registros)}">
            <p>No hay registros de sueño</p>
        </div>

    </div>

    <div th:if="${errores != null}" class="error-container">

        <div class="card error-card" th:each="err : ${errores}">

            <div class="header">
                <div class="image">❌</div>

                <div class="content">
                    <span class="title">Error</span>
                    <p class="message" th:text="${err}"></p>
                </div>
            </div>

        </div>

    </div>

    <div th:if="${success}" class="error-container">

        <div class="card success-card">

            <div class="header">
                <div class="image">✅</div>

                <div class="content">
                    <span class="title">Operación exitosa</span>
                    <p class="message" th:text="${success}"></p>
                </div>
            </div>

        </div>

    </div>

    <!-- Formulario para ingresar un nuevo registro de sueño -->
    <div class="form-section-wrap">

        <div class="form-section">

            <h2 class="form-title"
                th:text="${registro.id_registro_sueño != null} ? 'Editar Registro' : 'Nuevo Registro'">
            </h2>

            <form th:action="@{/registroSueno/guardar}"
                  th:object="${registro}"
                  method="post">

                <input type="hidden" th:field="*{id_registro_sueño}">

                <input class="form-input"
                       type="date"
                       th:field="*{fecha_sueño}"
                       required>

                <input class="form-input"
                       type="number"
                       step="0.01"
                       min="1"
                       max="15"
                       th:field="*{horas_dormidas}"
                       placeholder="Horas dormidas"
                       required>

                <!-- Calidad sueño como botones -->
                <div class="quality-group">

                    <label class="quality-option">
                        <input type="radio" th:field="*{calidad_sueño}" value="Excelente" required>
                        <span class="quality-btn excelente">Excelente</span>
                    </label>

                    <label class="quality-option">
                        <input type="radio" th:field="*{calidad_sueño}" value="Bien">
                        <span class="quality-btn bien">Bien</span>
                    </label>

                    <label class="quality-option">
                        <input type="radio" th:field="*{calidad_sueño}" value="Regular">
                        <span class="quality-btn regular">Regular</span>
                    </label>

                    <label class="quality-option">
                        <input type="radio" th:field="*{calidad_sueño}" value="Mal">
                        <span class="quality-btn mal">Mal</span>
                    </label>

                </div>

                <select class="form-input"
                        th:field="*{fk_id_usuario}"
                        required>

                    <option value="">Seleccione un usuario</option>

                    <option th:each="u : ${usuarios}"
                            th:value="${u.id_usuario}"
                            th:text="'ID: ' + ${u.id_usuario} + ' - ' + ${u.nombre_completo}">
                    </option>

                </select>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <span th:text="${registro.id_registro_sueño != null} ? 'Actualizar' : 'Guardar'"></span>
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

<!-- Modal del Eliminar -->
<div id="confirmModal" class="modal hidden">
    <div class="card confirm-card">

        <div class="header">
            <div class="image">⚠️</div>

            <div class="content">
                <span class="title">¿Eliminar registro?</span>
                <p class="message">Esta acción no se puede deshacer</p>
            </div>
        </div>

        <div class="actions">
            <button id="btnDelete" class="desactivate">
                Eliminar
            </button>

            <button onclick="closeModal()" class="cancel">
                Cancelar
            </button>
        </div>

    </div>
</div>

<!--Dirección del script buscar por id y el modal-->
<script th:src="@{/js/registroSueno.js}"></script>

</body>
</html>
