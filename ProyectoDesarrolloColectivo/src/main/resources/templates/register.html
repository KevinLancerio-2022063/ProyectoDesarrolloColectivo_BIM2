<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Desarrollo Colectivo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/login.css}" href="../static/css/login.css" />
</head>
<body>
<div class="bg"></div>
<div class="bg bg2"></div>
<div class="bg bg3"></div>

<div class="contenedor">
    <div class="tarjeta">
        <div class="panel-form">
            <h2 class="subtitulo">Crear cuenta</h2>
            <form class="formulario" th:action="@{/register}" method="post">
                <label for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre" type="text" placeholder="Tu nombre" required />

                <label for="correo">Correo</label>
                <input id="correo" name="usuario" type="email" placeholder="tu@correo.com" required />

                <label for="clave">Contraseña</label>
                <input id="clave" name="password" type="password" placeholder=".........." required />

                <label for="confirmar">Confirmar contraseña</label>
                <input id="confirmar" name="confirmarPassword" type="password" placeholder="Repite tu contraseña" required />

                <button type="submit" class="btn">Registrarme</button>
            </form>
            <p class="ayuda">
                ¿Ya tienes cuenta?
                <a class="link" th:href="@{/login}">Iniciar sesión</a>
            </p>
        </div>
        <div class="panel-info">
            <ul class="circles"><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul>
            <div class="info-contenido">
                <img th:src="@{/img/logo.png}" src="../static/img/logo.png}" alt="Logo Proyecto" class="logo-proyecto" />
                <p class="titulo-proyecto">Sistema Integral de Gestión <br> del <strong>Desarrollo Personal</strong></p>
            </div>
        </div>
    </div>
    <p class="footer">Proyecto Desarrollo Personal</p>
</div>
</body>
</html>
