<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - Desarrollo Colectivo</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}" href="../static/css/estilos.css" />
</head>
<body>

<div class="contenedor">
  <h1 class="titulo">Desarrollo Colectivo</h1>

  <div class="tarjeta">
    <h2 class="subtitulo">Crear cuenta</h2>

    <form class="formulario" th:action="@{/register}" method="post">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" type="text" placeholder="Tu nombre" required />

      <label for="correo">Correo</label>
      <input id="correo" name="usuario" type="email" placeholder="tu@correo.com" required />

      <label for="clave">Contraseña</label>
      <input id="clave" name="password" type="password" placeholder="Mínimo 8 caracteres" required />

      <label for="confirmar">Confirmar contraseña</label>
      <input id="confirmar" name="confirmarPassword" type="password" placeholder="Repite tu contraseña" required />

      <button type="submit" class="btn">Registrarme</button>
    </form>

    <p class="ayuda">
      ¿Ya tienes cuenta?
      <a class="link" th:href="@{/login}">Iniciar sesión</a>
    </p>
  </div>

  <p class="footer">Proyecto Desarrollo Personal</p>
</div>

</body>
</html>
